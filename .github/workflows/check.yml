name: Check source and TV package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:public
      - run: npm test
      - run: npm run build:tv
      - uses: actions/upload-artifact@v4
        with:
          name: apex-tv-${{ matrix.os }}
          path: dist/*
